<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1> University registration Form </h1>
    <p> Please fill out the form below to register: </p>
    <hr>

    <h2>Personal Details </h2>
    <form>

    <label for="name">First Name:</label>
    <input type="text" name="name" id="name" placeholder="eg.shivam" required>
    <br><br>
    <label for="surname">Last Name:</label>
    <input type="text" name="surname" id="surname" placeholder="eg.Kumar">
    <br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" name="dob" id="dob">
    <br><br>

    <label>Gender:</label>
    <br>
    <label for="Male">Male</label>
    <input type="radio" name="Gender" id="Male" value="Male">
    <br>

    <label for="Female">Female</label>
    <input type="radio" name="Gender" id="Female" value="Female">
    <br>

    <label for="Other">Other</label>
    <input type="radio" name="Gender" id="Other" value="Other">
    <br><br>
    
    <label>Upload your photo:</label>
    <br><br>
    <input type="file">
    <hr>

    <h2>Contact information</h2>
    <label for="email">Email Address: </label>
    <input type="email" name="email" id="email" placeholder="you@example.com">
    <br><br>

    <label for="number">Phone number: </label>
    <input type="number" name="number" id="number" placeholder="eg.1234567890">

    <br><br>
    <label for="Address">Mailing Address:</label>
    <br>
    <textarea name="Address" id="Address" placeholder="Street Address , City State ,Zip code" rows="5" cols="20" ></textarea> 
    <hr>

    <h2>Academic information</h2>

    <label for="Course">Select Your Course</label>
    <select name="Course" id="Course">
        <option value="CSE">CSE</option>
        <option value="DS">DS</option>
        <option value="AI">AI</option>
        <option value="AIML">AIML</option>
        <option value="Cyber Security">Cyber Securit</option>
    </select>
    <br><br>

    <label>Extracurricular Interests:</label>
    <br>
    
    <input type="checkbox" name="Interests" id="Sports" value="Sports">
    <label for="Sports">Sports</label>

    <br>

    <input type="checkbox" name="Interests" id="Music" value="Music">
    <label for="Music">Music & Arts</label>
    <br>

    <input type="checkbox" name="Interests" id="Technology" value="Technology">
    <label for="Technology">Technology Clubs</label>
    <br>

    <input type="checkbox" name="Interests" id="Volunteering" value="Volunteering">
    <label for="Volunteering">Volunteering</label>
    <br>

    <hr>

    <h2>Create Your Account</h2>

    <label for="pass">Create a password:</label>
    <input type="password" name="password" id="pass">
    <br><br>
    <label for="Security">Security Question:</label>
    <select name="Security" id="Security"> 
        <option>What was your first pet name </option>
        <option>what was your first school name </option>
        <option>what was your first friend name</option>
    </select>
    <br><br>

    <label for="Answer">Security Answer:</label>
    <input type="text" name="Security" id="Answer">

    <br><br>

    <input type="checkbox" name="Conditions" id="agree">
    <label for="agree">I agree to the Terms & Conditions.</label>
    <br><br>

    <hr>

    
    <button type="submit">Register</button>
    <button type="reset"> Clear Form</button>




    </form>
</body>
</html>
